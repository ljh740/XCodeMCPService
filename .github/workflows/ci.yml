name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.2
        if: matrix.runner == 'xcode-27'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve release bin path
        run: swift build -c release --show-bin-path

      - name: Build release binaries
        run: swift build -c release

      - name: Run tests
        run: swift test --parallel

      - name: Test signing discovery
        run: |
          bash -n build-app.sh
          /usr/bin/ruby Tests/signing_identity_test.rb
